<!DOCTYPE html>
<html lang="id">
<head>
    <title>Konten Kreator Analisa Tren</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div style="width: 80%; margin: auto;">
        <h1>Hashtag Paling Populer Saat Ini</h1>
        <canvas id="trendChart"></canvas>
    </div>

    <script>
        // Mengambil data dari file JSON yang dibuat Python
        fetch('top_hashtags.json')
            .then(response => response.json())
            .then(data => {
                const labels = data.map(item => item.hashtag);
                const counts = data.map(item => item.count);

                const ctx = document.getElementById('trendChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar', // Tipe grafik batang
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Jumlah Penggunaan Hashtag',
                            data: counts,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: { y: { beginAtZero: true } }
                    }
                });
            });
    </script>
</body>
</html>
