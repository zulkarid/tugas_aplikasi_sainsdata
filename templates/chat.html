<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Social Media Analyst</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .chat-container { max-width: 800px; margin: 30px auto; }
        #chat-box { height: 450px; overflow-y: auto; background: white; }
        .message { margin-bottom: 15px; }
        .user-msg { text-align: right; }
        .ai-msg { text-align: left; }
    </style>
</head>
<body>

<div class="container chat-container">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">🤖 AI Social Media Analyst (RAG)</h5>
            <span class="badge bg-success">Model: DeepSeek-R1-Spec</span>
        </div>
        
        <div id="chat-box" class="card-body border-bottom p-4">
            <div class="message ai-msg">
                <p class="mb-1"><b>AI Analyst:</b></p>
                <div class="p-2 bg-light border rounded d-inline-block" style="max-width: 85%;">
                    Halo! Saya sudah membaca dataset Instagram Anda. Silakan tanyakan tren, topik, atau analisis dari data tersebut.
                </div>
            </div>
        </div>
        
        <div class="card-footer bg-white p-3">
            <div class="input-group">
                <input type="text" id="user-input" class="form-control" placeholder="Ketik pertanyaan analisis di sini...">
                <button class="btn btn-dark" onclick="kirimPesan()">Kirim</button>
            </div>
        </div>
    </div>
</div>

<script>
function kirimPesan() {
    const inputEl = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    const pesan = inputEl.value.trim();
    
    if (!pesan) return;
    
    // Tampilkan pesan user
    chatBox.innerHTML += `
        <div class="message user-msg">
            <p class="mb-1"><b>Anda:</b></p>
            <div class="p-2 bg-primary text-white rounded d-inline-block text-start" style="max-width: 85%;">
                ${pesan}
            </div>
        </div>
    `;
    inputEl.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    // Tampilkan status loading
    const loadingId = "loading-" + Date.now();
    chatBox.innerHTML += `
        <div id="${loadingId}" class="message ai-msg">
            <p class="mb-1"><b>AI Analyst:</b></p>
            <div class="p-2 bg-light border rounded d-inline-block text-muted">
                <em>Sedang menganalisis dataset...</em>
            </div>
        </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;

    // Tembak API Flask
    fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: pesan })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById(loadingId).remove();

        if (data.status === 'success') {
            chatBox.innerHTML += `
                <div class="message ai-msg">
                    <p class="mb-1"><b>AI Analyst:</b></p>
                    <div class="p-2 bg-white border rounded d-inline-block" style="max-width: 85%; white-space: pre-line;">
                        ${data.reply}
                    </div>
                </div>
            `;
        } else {
            chatBox.innerHTML += `
                <div class="message text-danger">
                    <b>Error:</b> ${data.message}
                </div>
            `;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    })
    .catch(err => {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="message text-danger"><b>Error:</b> Gagal terhubung ke backend.</div>`;
    });
}

document.getElementById('user-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') kirimPesan();
});
</script>

</body>
</html>
